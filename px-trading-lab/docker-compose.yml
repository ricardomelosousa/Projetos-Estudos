services:

  orders-postgres:
    image: postgres:18
    container_name: trading-orders-postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_orders"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    environment:
      POSTGRES_DB: trading_orders
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading123

    ports:
      - "5432:5432"

    volumes:
      - trading-orders-postgres-data:/var/lib/postgresql

    networks:
      - trading-network


  trades-postgres:
    image: postgres:18
    container_name: trading-trades-postgres

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading -d trading_trades"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    environment:
      POSTGRES_DB: trading_trades
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading123

    ports:
      - "5433:5432"

    volumes:
      - trading-trades-postgres-data:/var/lib/postgresql

    networks:
      - trading-network


  kafka:
    image: apache/kafka:4.3.1

    container_name: trading-kafka

    volumes:
      - kafka-data:/var/lib/kafka/data

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:
      - trading-network


  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest

    container_name: trading-kafka-ui

    ports:
      - "8085:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: trading-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    depends_on:
      - kafka

    networks:
      - trading-network


  kafka-init:
    image: apache/kafka:4.3.1

    container_name: trading-kafka-init

    depends_on:
      - kafka

    entrypoint: ["/bin/sh", "-c"]

    command: >
      "
        echo 'Aguardando Kafka...' ;

        until /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server kafka:9092
          --list > /dev/null 2>&1;
        do
          sleep 2;
        done;

        echo 'Kafka disponível. Criando tópico...' ;

        /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server kafka:9092
          --create
          --if-not-exists
          --topic orders.created
          --partitions 3
          --replication-factor 1;

        echo 'Tópicos disponíveis:' ;

        /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server kafka:9092
          --list;
      "

    networks:
      - trading-network


  orders-api:
    container_name: trading-orders-api

    build:
      context: .
      dockerfile: src/Services/Orders/Trading.Orders.Api/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ConnectionStrings__OrdersDatabase: Host=orders-postgres;Port=5432;Database=trading_orders;Username=trading;Password=trading123

      Kafka__BootstrapServers: kafka:9092
      Kafka__Topics__OrderCreated: orders.created

    depends_on:
      orders-postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    networks:
      - trading-network


  trade-processor:
    container_name: trading-trade-processor

    build:
      context: .
      dockerfile: src/Workers/TradeProcessor/Trading.TradeProcessor.Worker/Dockerfile

    environment:
      DOTNET_ENVIRONMENT: Development

      ConnectionStrings__Postgres: Host=trades-postgres;Port=5432;Database=trading_trades;Username=trading;Password=trading123

      Kafka__BootstrapServers: kafka:9092
      Kafka__GroupId: trade-processor
      Kafka__Topics__OrderCreated: orders.created

    depends_on:
      trades-postgres:
        condition: service_healthy

      kafka:
        condition: service_started

    restart: unless-stopped

    networks:
      - trading-network


  gateway:
    container_name: trading-gateway

    build:
      context: .
      dockerfile: src/Services/Gateway/Trading.Gateway/Dockerfile

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080

      ReverseProxy__Clusters__orders-cluster__Destinations__orders-api__Address: http://orders-api:8080/

    ports:
      - "8080:8080"

    depends_on:
      - orders-api

    networks:
      - trading-network


networks:

  trading-network:
    driver: bridge


volumes:

  trading-orders-postgres-data:

  trading-trades-postgres-data:

  kafka-data: